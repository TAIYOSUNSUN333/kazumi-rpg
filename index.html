    rect(a,100+(column%3)*5,7,2,'#9e886f');
    for(const row of [26,181]){
      rect(a+7,row+9,5,10,'#554254');
      rect(a+2,row+3,15,10,foliage);
      rect(a+5,row,10,5,foliage);
    }
    rect(a+3,55+(column%4)*22,3,2,'#928699');
  }
  gems.forEach((item,i)=>{
    if(!item.on)return;
    const a=item.x-cam,row=gemLane(i);
    polygon('#ffe199',[[a,row-8],[a+6,row],[a,row+8],[a-6,row]]);
  });
  npcs.forEach(n=>{
    if(n.used)return;
    sprite(n.x-cam-9,84,n.n);
    g.fillStyle='#fff5df';g.font='11px sans-serif';g.fillText(n.n,n.x-cam-9,80);
  });
  enemies.forEach(e=>{
    if(e.h<=0)return;
    const a=e.x-cam, offset=e.row-104;
    rect(a-9,97+offset,18,13,'#763956');
    rect(a-6,94+offset,12,4,'#ab5f83');
    rect(a-5,100+offset,3,2,'#ffe199');rect(a+3,100+offset,3,2,'#ffe199');
  });
  for(const shrine of shrines){
    if(shrine.solved)continue;
    rect(shrine.x-cam-10,shrine.row-13,20,25,'#533b5f');
    rect(shrine.x-cam-7,shrine.row-9,14,15,'#d2ab81');
  }
  sprite(x-cam-9,y-20,'一美');
  if(shrineGlow){
    const radius=(37-shrineGlow)*1.8;
    g.strokeStyle='#ffe3a6';
    g.globalAlpha=shrineGlow/36;
    g.beginPath();
    g.arc(shrines[stage].x-cam,shrines[stage].row,radius,0,Math.PI*2);
    g.stroke();
    g.globalAlpha=1;
  }
}
function drawBattle(){
  const boss=foe===enemies[enemies.length-1];
  rect(0,0,320,208,boss?'#22162e':'#1c2935');
  rect(118,58,84,80,'#10101e');
  polygon('#343249',[[0,0],[118,58],[118,138],[0,208]]);
  polygon('#343249',[[320,0],[202,58],[202,138],[320,208]]);
  polygon('#261f39',[[0,208],[118,138],[202,138],[320,208]]);
  for(const inset of [12,40,70,96]){
    const top=inset/2;
    rect(inset,top,2,208-top*2,'#554761');
    rect(318-inset,top,2,208-top*2,'#554761');
  }
  for(const row of [149,164,187])rect(0,row,320,1,'#524055');
  const aura=attack>7?'#efa8a5':exposed?'#e0ad72':enemyIntent().heavy?'#bd5876':boss?'#9c487a':'#657999';
  const width=boss?65:42;
  polygon(aura,[[160-width,146],[160-width-17,106],[140,118],[160,65],[180,118],[160+width+17,106],[160+width,146],[160,162]]);
  polygon('#322139',[[126,96],[145,105],[175,105],[194,96],[186,138],[160,154],[134,138]]);
  rect(140,117,13,4,'#ffe39b');rect(167,117,13,4,'#ffe39b');
  if(boss){
    polygon('#d6ac6f',[[136,98],[132,77],[149,91],[160,75],[171,91],[188,77],[184,98]]);
    rect(153,139,14,5,'#cb6a9c');
  }
}
const movementInterval=1000/60;
let lastFrame=null, elapsed=0;
const pointers=new Map();
function clearMovement(){
  keys={};
  pointers.clear();
}
function step(){
  if(attack)attack--;
  if(shrineGlow)shrineGlow--;
  if(!done&&hp>0&&!foe&&!shrineOpen){
    if(destination!==null){
      move(Math.sign(destination.x-x)*Math.min(3,Math.abs(destination.x-x)),Math.sign(destination.y-y)*Math.min(3,Math.abs(destination.y-y)));
      if(x===destination.x&&y===destination.y)destination=null;
    }
    const held=new Set(pointers.values());
    const pressed=key=>Number(Boolean(keys[key])||held.has(key));
    move(2*(pressed('right')-pressed('left')),2*(pressed('down')-pressed('up')));
    for(const n of npcs){
      if(n.used||!near(n,104,14))continue;
      n.used=true;
      if(n.n==='タク'&&Math.random()<.5)say('タクは旅に出た。別の力を探そう！');
      else{party.push(n.n);say(n.n+'が仲間になった！')}
      saveProgress(false);
    }
    gems.forEach((item,i)=>{
      if(!item.on||!near(item,gemLane(i),11))return;
      item.on=false;art++;say('星のアーティファクトを発見！');saveProgress(false);
    });
    const index=chapterOf(x);
    const shrine=shrines[index];
    const nearby=enemies.find(e=>e.chapter===index&&e.h>0&&near(e,e.row,13));
    if(!shrine.solved&&near(shrine,shrine.row,10))openShrine(shrine,index);
    else if(nearby)startBattle(nearby);
  }
}
function loop(timestamp){
  if(lastFrame!==null)elapsed+=Math.min(timestamp-lastFrame,50);
  lastFrame=timestamp;
  while(elapsed>=movementInterval){
    step();
    elapsed-=movementInterval;
  }
  stage=chapterOf(x);
  if(shownChapter!==stage){
    $('chapter-note').textContent=chapterNotes[stage];
    shownChapter=stage;
  }
  if(foe)drawBattle();else drawField();
  $('hud').textContent='第'+(stage+1)+'章 '+chapterInfo[stage][0]+'　HP '+hp+'/'+hpMax()+'　Lv.'+lv+'　✦ '+art;
  $('party').textContent='仲間：'+(party.join(' / ')||'なし');
  requestAnimationFrame(loop);
}
document.querySelectorAll('[data-k]').forEach(button=>{
  const key=button.dataset.k;
  button.onpointerdown=event=>{
    if(event.button!==0||foe||done||shrineOpen)return;
    destination=null;
    button.setPointerCapture(event.pointerId);
    move(key==='right'?8:key==='left'?-8:0,key==='down'?8:key==='up'?-8:0);
    pointers.set(event.pointerId,key);
  };
  button.onpointerup=button.onpointercancel=button.onlostpointercapture=event=>pointers.delete(event.pointerId);
  button.onclick=event=>{
    if(event.detail!==0||foe||done||shrineOpen)return;
    destination=null;
    move(key==='right'?8:key==='left'?-8:0,key==='down'?8:key==='up'?-8:0);
  };
});
const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
window.addEventListener('keydown',event=>{
  if(!map[event.key]||foe||done||shrineOpen)return;
  event.preventDefault(); destination=null; keys[map[event.key]]=true;
});
window.addEventListener('keyup',event=>{if(map[event.key])keys[map[event.key]]=false});
window.addEventListener('blur',clearMovement);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)return;
  clearMovement();
  lastFrame=null;
  elapsed=0;
});
$('next').onclick=()=>{
  if(foe||done||shrineOpen||hp<=0)return;
  const index=chapterOf(x), shrine=shrines[index], edge=enemies[index*8+7];
  const rowPoint=item=>({x:item.x,y:item.row});
  const points=[
    ...npcs.filter(n=>!n.used).map(n=>({x:n.x,y:104})),
    ...gems.filter(gem=>gem.on).map(rowPoint),
    ...enemies.filter(enemy=>enemy.chapter===index&&enemy.h>0&&!enemy.optional&&(!enemy.guardian||shrine.solved)).map(rowPoint),
    ...(!shrine.solved?[rowPoint(shrine)]:[])
  ].filter(point=>point.x>x+1||(Math.abs(point.x-x)<=1&&Math.abs(point.y-y)>8))
   .sort((a,b)=>a.x-b.x);
  const ready=points.find(point=>point.x<=(index+1)*span&&(shrine.solved||point.x<=shrine.x));
  destination=ready??(!shrine.solved?rowPoint(shrine):edge.h>0?rowPoint(edge):
    {x:camps[Math.min(last,index+1)].x,y:104});
};
function saveProgress(explicit){
  try{
    localStorage.setItem('kazumi',JSON.stringify({version:2,x,y,hp,xp,lv,party,art,usedNpcs:npcs.map(n=>Boolean(n.used)),gems:gems.map(gem=>gem.on),enemies:enemies.map(enemy=>enemy.h),shrines:shrines.map(shrine=>shrine.solved),done}));
    if(explicit)say('このブラウザに冒険を保存した！');
  }catch(error){if(explicit)say('このブラウザでは保存できません。')}
}
$('save').onclick=()=>saveProgress(true);
$('reset').onclick=()=>{
  if(confirm('このブラウザの冒険を消して、最初から遊びますか？')){
    try{localStorage.removeItem('kazumi')}catch(error){}
    location.reload();
  }
};
try{
  const saved=JSON.parse(localStorage.getItem('kazumi'));
  if(saved?.version===2){
    ({x,y,hp,xp,lv,party,art,done}=saved);
    npcs.forEach((n,i)=>n.used=saved.usedNpcs[i]);
    gems.forEach((gem,i)=>gem.on=saved.gems[i]);
    enemies.forEach((enemy,i)=>enemy.h=saved.enemies[i]);
    shrines.forEach((shrine,i)=>shrine.solved=saved.shrines[i]);
    if(done){$('walk').hidden=true;$('next').disabled=true;say('一美の冒険をクリア済み！')}
    else{hp=Math.max(1,hp);say('冒険を再開！')}
  }else if(saved&&Array.isArray(saved.party)){
    party=saved.party;art=saved.art||0;xp=saved.xp||0;lv=1+Math.floor(xp/80);hp=hpMax();
    npcs.forEach(n=>n.used=party.includes(n.n)||Boolean(saved.npcs?.find(old=>old.n===n.n)?.used));
    say('長編の旅が始まった。前の冒険の仲間と宝石を引き継いだよ。');
  }
}catch(error){}
requestAnimationFrame(loop);
</script></html>
