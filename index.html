<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151526">
  <title>一美のスター街道</title>
  <link rel="stylesheet" href="game.css">
  <script defer src="world.js"></script>
  <script defer src="audio.js"></script>
  <script defer src="companions.js"></script>
  <script defer src="game.js"></script>
  <script defer src="render.js"></script>
</head>
<body>
  <main id="game">
    <canvas id="scene" width="640" height="360" aria-label="一美の冒険"></canvas>
    <header id="hud" hidden>
      <strong id="location"></strong>
      <div id="vitals"></div>
      <div id="progress"></div>
      <div id="companion-status" hidden></div>
      <div id="enemy-status" hidden></div>
      <progress id="enemy-hp" aria-label="敵の残りHP" hidden></progress>
      <div id="awakening" hidden><div id="soso-status"></div><progress id="awake-gauge" aria-label="ソソの覚醒ゲージ"></progress></div>
    </header>
    <p id="message" role="status" aria-live="polite"></p>
    <div id="portrait">スマートフォンを横にすると遊びやすくなります</div>
    <nav id="menu" aria-label="メニュー">
      <button id="pause" hidden>メニュー</button>
      <button id="mute" aria-pressed="false">消音</button>
    </nav>
    <nav id="dpad" aria-label="移動" hidden>
      <button data-hold="up" aria-label="上へ">↑</button>
      <button data-hold="left" aria-label="左へ">←</button>
      <button data-hold="right" aria-label="右へ">→</button>
      <button data-hold="down" aria-label="下へ">↓</button>
    </nav>
    <nav id="actions" aria-label="アクション" hidden>
      <button data-hold="attack">攻撃</button>
      <button data-hold="dodge">回避</button>
      <button data-hold="jump">ジャンプ</button>
      <button id="magic" data-hold="magic" disabled>魔法</button>
      <button id="special" data-hold="special">ソソを思う</button>
    </nav>
    <section id="panel" aria-labelledby="panel-title">
      <h1 id="panel-title">一美のスター街道</h1>
      <div id="panel-body"></div>
      <div id="panel-buttons"></div>
    </section>
    <div id="fade" aria-hidden="true"></div>
    <div id="level" aria-hidden="true"></div>
  </main>
</body>
</html>
