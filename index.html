<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151526">
  <title>一美のスター街道</title>
  <link rel="stylesheet" href="game.css">
  <script defer src="prefectures.js"></script>
  <script defer src="world.js"></script>
  <script defer src="riddles.js"></script>
  <script defer src="audio.js"></script>
  <script defer src="companions.js"></script>
  <script defer src="towns.js"></script>
  <script defer src="tourism.js"></script>
  <script defer src="graphics.js"></script>
  <script defer src="battlefield.js"></script>
  <script defer src="inn.js"></script>
  <script defer src="terrain.js"></script>
  <script defer src="movement.js"></script>
  <script defer src="game.js"></script>
  <script defer src="render.js"></script>
</head>
<body>
  <main id="game">
    <canvas id="scene" width="640" height="360" aria-label="一美の冒険"></canvas>
    <header id="hud" hidden>
      <strong id="location"></strong>
      <div id="town-clock"></div>
      <div id="vitals"></div>
      <div id="progress"></div>
      <div id="companion-status" hidden></div>
      <div id="enemy-status" hidden></div>
      <progress id="enemy-hp" aria-label="敵の残りHP" hidden></progress>
      <div id="awakening" hidden><div id="soso-status"></div><progress id="awake-gauge" aria-label="ソソの覚醒ゲージ"></progress></div>
    </header>
    <p id="message" role="status" aria-live="polite"></p>
    <div id="portrait">スマートフォンを横にすると遊びやすくなります</div>
    <div id="place-title" role="status" hidden></div>
    <nav id="menu" aria-label="メニュー">
      <button id="pause" aria-label="メニュー" hidden>
        <svg aria-hidden="true" viewBox="0 0 36 36"><path d="M8 10h20M8 18h20M8 26h20"/><path d="M5 18l2-2 2 2-2 2Zm22 0 2-2 2 2-2 2Z"/></svg>
      </button>
    </nav>
    <div id="joystick" role="group" aria-label="移動（ジョイスティック）" hidden>
      <span id="stick-knob" aria-hidden="true"></span>
    </div>
    <nav id="actions" aria-label="アクション" hidden>
      <button data-hold="attack" id="slash" aria-label="斬撃">
        <svg aria-hidden="true" viewBox="0 0 36 36"><path d="m6 30 4-7L26 6l5-2-2 5L13 26l-7 4Z"/><path d="m8 20 9 8m-9-2L5 31m16-17 5-5"/></svg>
      </button>
      <button data-hold="jump" id="jump" aria-label="ジャンプ">
        <svg aria-hidden="true" viewBox="0 0 36 36"><circle cx="23" cy="8" r="3"/><path d="m13 12 9 4 5-4m-5 4-4 7m0 0 9 3-3 5m-6-8-5 6-5-1M8 12l4-3M5 21l4-3"/></svg>
      </button>
      <button data-hold="shot" id="shot" aria-label="魔法">
        <svg aria-hidden="true" viewBox="0 0 36 36"><circle cx="18" cy="18" r="13"/><circle cx="18" cy="18" r="9"/><path d="m18 4 8 18H10Zm0 28 8-18H10Zm0-27v26M5 18h26"/></svg>
        <svg class="cooldown-ring" aria-hidden="true" viewBox="0 0 68 68"><circle cx="34" cy="34" r="31" pathLength="100"/></svg>
      </button>
    </nav>
    <section id="panel" aria-labelledby="panel-title">
      <h1 id="panel-title">一美のスター街道</h1>
      <div id="panel-body"></div>
      <div id="panel-buttons"></div>
    </section>
    <aside id="stay-controls" hidden aria-label="宿泊">
      <p id="stay-caption" role="status"></p>
      <div id="stay-choices"></div>
      <button id="stay-skip">宿泊演出をスキップ</button>
    </aside>
    <div id="quiz-flash" aria-hidden="true"></div>
    <div id="fade" aria-hidden="true"></div>
    <div id="level" aria-hidden="true"></div>
  </main>
</body>
</html>
