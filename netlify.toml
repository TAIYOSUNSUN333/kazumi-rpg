[build]
  publish = "."

[[headers]]
  for = "/assets/bgm/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/bgm-studio/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/bgm-admin"
  to = "/bgm-studio/"
  status = 302
  force = true

[[redirects]]
  from = "/bgm-admin/"
  to = "/bgm-studio/"
  status = 302
  force = true

[[redirects]]
  from = "/bgm-admin/index.html"
  to = "/bgm-studio/"
  status = 302
  force = true
